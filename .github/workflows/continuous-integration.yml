name: Continuous integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
jobs:
  policy:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native workflow and source contracts
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'jpg-spinner-workflow-tools'
          ./scripts/tests/Test-WorkflowVerificationToolContract.ps1 -ToolsDirectory $tools
          ./scripts/Test-GitHubWorkflowPolicy.ps1 -ToolsDirectory $tools -WorkflowPaths @('.github/workflows/continuous-integration.yml', '.github/workflows/codeql.yml', '.github/workflows/nightly-fuzz.yml')
          ./scripts/tests/Test-ContinuousIntegrationContract.ps1 -ToolsDirectory $tools
          ./scripts/tests/Test-BuildProvenanceControls.ps1 -OwnedOutputRoot $env:RUNNER_TEMP
          # Isolate intentional negative-control native exit codes from the
          # caller's LASTEXITCODE; only this script's process result is a gate.
          pwsh -NoProfile -File ./scripts/Test-RepositoryPolicy.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - architecture: x86
            configuration: Debug
          - architecture: x86
            configuration: Release
          - architecture: x64
            configuration: Debug
          - architecture: x64
            configuration: Release
          - architecture: ARM64
            configuration: Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve native cache identity
        id: native-inputs
        run: |
          Import-Module ./scripts/JsonObjectMemberValidation.psm1
          $manifest = ConvertFrom-JsonWithUniqueObjectMembers -JsonText (Get-Content ./vcpkg.json -Raw) -SourceDescription 'vcpkg manifest' -RequiredRootValueKind Object -AsHashtable
          $toolchain = ./scripts/Resolve-MSBuildToolchain.ps1
          "baseline=$($manifest['builtin-baseline'])" >> $env:GITHUB_OUTPUT
          "toolset=$($toolchain.vcToolsVersion)" >> $env:GITHUB_OUTPUT
          $binaryCache = Join-Path $env:RUNNER_TEMP 'jpg-spinner-vcpkg-cache'
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path $binaryCache -Force | Out-Null
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # vcpkg validates native ABI-addressed archives; never cache staged
          # packages, signing material, installed trees or test results.
          path: |
            ~/.nuget/packages
            ${{ runner.temp }}/jpg-spinner-vcpkg-cache
          key: dependencies-${{ runner.os }}-${{ matrix.architecture }}-${{ matrix.configuration }}-${{ steps.native-inputs.outputs.toolset }}-${{ steps.native-inputs.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**', 'vcpkg-ports/**', 'eng/toolchain-lock.json', 'Directory.Packages.props', '**/packages.lock.json') }}
      - name: Build the selected architecture
        run: |
          ./scripts/Invoke-Build.ps1 -Configuration '${{ matrix.configuration }}' -Architecture '${{ matrix.architecture }}' -MaximumBuildProcessCount 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check bounded native host shutdown
        if: matrix.architecture == 'x64' && matrix.configuration == 'Release'
        run: |
          ./scripts/tests/Test-PresentationHostShutdown.ps1 -Scenario RecoveryDiagnostic -OutputDirectory 'artifacts/TestResults/x64/Release/PresentationShutdown'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native headless tests
        if: matrix.architecture != 'ARM64'
        run: |
          ./scripts/Invoke-TestSuite.ps1 -Project HeadlessAll -Configuration '${{ matrix.configuration }}' -Architecture '${{ matrix.architecture }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record selected inputs and actual runner
        run: |
          New-Item -ItemType Directory -Path artifacts/provenance -Force | Out-Null
          ./scripts/New-BuildProvenance.ps1 -Configuration '${{ matrix.configuration }}' -Architecture '${{ matrix.architecture }}' -RequireCleanSourceTree -OutputPath 'artifacts/provenance/build.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-${{ matrix.architecture }}-${{ matrix.configuration }}
          retention-days: 14
          path: |
            artifacts/build-logs/
            artifacts/TestResults/
            artifacts/provenance/
  asan:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the locked native project graph
        run: |
          ./scripts/Invoke-Build.ps1 -Configuration Release -Architecture x64 -MaximumBuildProcessCount 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run instrumented JPEG suites
        run: ./scripts/Invoke-JpegSanitizerTests.ps1 -TestSpecification '[jpeg]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jpeg-asan-evidence
          retention-days: 14
          path: artifacts/build-logs/
  analysis:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: MSVC native code analysis
        run: |
          ./scripts/tests/Test-StaticAnalysisWarningControl.ps1 -OutputDirectory artifacts/analysis-warning-control
          ./scripts/Invoke-StaticAnalysis.ps1 -OutputDirectory artifacts/analysis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: msvc-analysis-evidence
          retention-days: 14
          path: |
            artifacts/analysis/
            artifacts/analysis-warning-control/
            artifacts/obj/**/*.nativecodeanalysis.xml
