name: CodeQL
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
defaults:
    run:
        shell: pwsh
jobs:
    cpp:
        runs-on: windows-2025-vs2026
        timeout-minutes: 180
        permissions:
            contents: read
            actions: read
            security-events: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install the pinned Windows SDK
              # Prepare the adopted SDK before CodeQL traces the real build.
              # The timeout is materialized from the shared qualification policy.
              timeout-minutes: 45
              run: ./scripts/Install-HostedWindowsSdk.ps1 -OutputDirectory artifacts/build-logs/windows-sdk
            - name: Install vcpkg dependencies before tracing
              # Third-party ports are built outside the CodeQL trace, so the
              # analysis covers this repository's code rather than vendor
              # sources rebuilt under a new path for every dependency update.
              run: |
                  ./scripts/Invoke-Build.ps1 -Configuration Release -Architecture x64 -BuildEntryPoint NativeDependencies
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  languages: c-cpp
                  build-mode: manual
                  queries: security-extended
            - name: Trace the real clean x64 build
              run: |
                  ./scripts/Invoke-Build.ps1 -Configuration Release -Architecture x64 -MaximumBuildProcessCount 2
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  category: cpp-security-extended
                  upload: never
                  output: artifacts/codeql-sarif
            - name: Remove generated C++/WinRT projection results
              run: ./scripts/Remove-GeneratedCodeScanningResults.ps1 -SarifDirectory artifacts/codeql-sarif
            - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  sarif_file: artifacts/codeql-sarif
                  category: cpp-security-extended
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              with:
                  name: codeql-native-build-diagnostics
                  # Generated from the shared artifact policy; retain diagnostics,
                  # never the SDK installation, compiler cache or CodeQL database.
                  retention-days: 1
                  compression-level: 9
                  path: artifacts/build-logs/
